name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (clippy + fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: PowerShell module import smoke
        shell: pwsh
        run: pwsh -NoProfile -Command 'Import-Module ./powershell/PwDirEnv/PwDirEnv.psd1 -Force'

      - name: Build the CLI for end-to-end tests
        run: cargo build --workspace

      - name: PowerShell end-to-end tests
        shell: pwsh
        run: |
          foreach ($test in @('smoke', 'e2e_trust', 'e2e_hook', 'e2e_path_torture')) {
            pwsh -NoProfile -File "tests/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
