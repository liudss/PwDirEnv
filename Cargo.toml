[workspace]
resolver = "2"
members = [
    "crates/pwdir-protocol",
    "crates/pwdir-core",
    "crates/pwdir-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/PwDirEnv"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
wait-timeout = "0.2"
